# PR preview deploys to gh-pages under pr-preview/pr-{n}/
# Follows https://github.com/rossjrw/pr-preview-action setup + full example.

name: Deploy PR previews

concurrency: preview-${{ github.ref }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        if: github.event.action != 'closed'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload
        if: github.event.action != 'closed'
        run: dotnet workload install wasm-tools

      - name: Publish
        if: github.event.action != 'closed'
        run: >
          dotnet publish Webassembly/Webassembly.csproj
          -c:Release
          -o:publish
          -p:GHPages=true
          -p:GHPagesBase=/pr-preview/pr-${{ github.event.number }}/

      # Previews must not register a service worker: the production worker is root-scoped
      # and would otherwise keep hijacking /pr-preview/ navigations for returning visitors.
      - name: Disable service worker in preview
        if: github.event.action != 'closed'
        run: |
          cat > publish/wwwroot/sw-registrator.js <<'EOF'
          window.updateAvailable = Promise.resolve(false);
          window.registerForUpdateAvailableNotification = () => {};
          window.appUpdate = {
            checkForUpdates: async () => ({ status: 'Unsupported' }),
            applyUpdate: async () => {},
            subscribe: () => {},
            unsubscribe: () => {}
          };
          EOF
          rm -f publish/wwwroot/service-worker.js \
                publish/wwwroot/service-worker.js.br \
                publish/wwwroot/service-worker.js.gz \
                publish/wwwroot/service-worker-assets.js \
                publish/wwwroot/service-worker-assets.js.br \
                publish/wwwroot/service-worker-assets.js.gz

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./publish/wwwroot/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: siteswaps.passing.zone
          action: auto
          comment: true
          qr-code: true
          # Pages build polling is flaky with custom domains / concurrent gh-pages pushes.
          wait-for-pages-deployment: false
