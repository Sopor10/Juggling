# PR previews use a commit-specific gh-pages path to avoid stale CDN assets.
# Follows https://github.com/rossjrw/pr-preview-action setup + full example.

name: Deploy PR previews

concurrency: preview-${{ github.ref }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        if: github.event.action != 'closed'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        if: github.event.action != 'closed'
        run: >
          dotnet publish Webassembly/Webassembly.csproj
          -c:Release
          -o:publish
          -p:GHPages=true
          -p:GHPagesBase=/pr-preview/${{ github.event.pull_request.head.sha }}/pr-${{ github.event.number }}/

      # GitHub Pages serves its root 404 page for deep links, which gives a
      # PR preview the production base URL. Add an index at this route so the
      # Siteswap Lab state can load inside the preview's own base path.
      - name: Add Siteswap Lab preview route
        if: github.event.action != 'closed'
        run: |
          mkdir -p publish/wwwroot/siteswap-lab
          cp publish/wwwroot/index.html publish/wwwroot/siteswap-lab/index.html

          preview_version="${GITHUB_SHA:0:12}"
          cp publish/wwwroot/sw-registrator.js "publish/wwwroot/sw-registrator-${preview_version}.js"
          sed -i "s/sw-registrator\.js/sw-registrator-${preview_version}.js/g" \
            publish/wwwroot/index.html \
            publish/wwwroot/siteswap-lab/index.html

      # The normal registrator detects /pr-preview/, unregisters any existing root-scoped
      # worker and avoids registering another one. Remove the published worker assets too.
      - name: Disable service worker in preview
        if: github.event.action != 'closed'
        run: |
          rm -f publish/wwwroot/service-worker.js \
                publish/wwwroot/service-worker.js.br \
                publish/wwwroot/service-worker.js.gz \
                publish/wwwroot/service-worker-assets.js \
                publish/wwwroot/service-worker-assets.js.br \
                publish/wwwroot/service-worker-assets.js.gz

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./publish/wwwroot/
          preview-branch: gh-pages
          umbrella-dir: pr-preview/${{ github.event.pull_request.head.sha }}
          pages-base-url: siteswaps.passing.zone
          action: auto
          comment: true
          qr-code: true
          # Pages build polling is flaky with custom domains / concurrent gh-pages pushes.
          wait-for-pages-deployment: false
