name: Reusable steps (AKA composite action)
description: Demonstrate how to use reusable steps in a workflow
runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
    - name: Restore tools
      run: dotnet tool restore
      shell: bash
    - name: Csharpier
      run: dotnet csharpier check .
      shell: bash
    - name: Install workload
      run: dotnet workload install wasm-tools
      shell: bash
    - name: Install Playwright browsers
      run: |
        dotnet build Siteswaps.E2ETests/Siteswaps.E2ETests.csproj
        pwsh Siteswaps.E2ETests/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium
      shell: bash
    - name: Test
      run: |
        mkdir -p artifacts
        dotnet test --logger "trx;LogFileName=ci-tests.trx" -bl:artifacts/ci-tests.binlog -- \
          xUnit.ParallelizeTestCollections=true \
          xUnit.MaxParallelThreads=4
      shell: bash
    - name: Upload test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-diagnostics
        path: |
          artifacts/ci-tests.binlog
          **/TestResults/ci-tests.trx
        if-no-files-found: ignore
        retention-days: 3
    - name: Upload design screenshot diffs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: design-screenshot-diffs
        path: |
          Siteswaps.Design.Tests/Tests/**/*.received.*
          Siteswaps.Design.Tests/Tests/**/*.verified.png
        if-no-files-found: ignore
        retention-days: 14
