name: Reusable steps (AKA composite action)
description: Demonstrate how to use reusable steps in a workflow
runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100
    - name: Restore tools
      run: dotnet tool restore
      shell: bash
    - name: Csharpier
      run: dotnet csharpier check .
      shell: bash
    - name: Test
      run: |
        dotnet test Juggling.slnx -m --logger "trx;LogFileName=ci-tests.trx"
      shell: bash
      env:
        PLAYWRIGHT_CHANNEL: chrome
    - name: Upload test timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-timings
        path: |
          **/TestResults/ci-tests.trx
        if-no-files-found: ignore
        retention-days: 3
    - name: Upload design screenshot diffs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: design-screenshot-diffs
        path: |
          Siteswaps.Design.Tests/Tests/**/*.received.*
          Siteswaps.Design.Tests/Tests/**/*.verified.png
        if-no-files-found: ignore
        retention-days: 14
