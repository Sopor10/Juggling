name: Reusable steps (AKA composite action)
description: Demonstrate how to use reusable steps in a workflow
runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100-preview.7.26381.103
    - name: Restore tools
      run: dotnet tool restore
      shell: bash
    - name: Csharpier
      run: dotnet csharpier check .
      shell: bash
    - name: Install workload
      run: dotnet workload install wasm-tools
      shell: bash
    - name: Install Playwright browsers
      run: |
        dotnet build Siteswaps.E2ETests/Siteswaps.E2ETests.csproj
        pwsh Siteswaps.E2ETests/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium
      shell: bash
    - name: Test
      run: dotnet test
      shell: bash
    - name: Upload design screenshot diffs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: design-screenshot-diffs
        path: |
          Siteswaps.Design.Tests/Tests/**/*.received.*
          Siteswaps.Design.Tests/Tests/**/*.verified.png
        if-no-files-found: ignore
        retention-days: 14
