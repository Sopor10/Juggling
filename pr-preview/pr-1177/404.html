<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Siteswap Helper</title>
    <base href="/pr-preview/pr-1177/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="Webassembly.styles.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/style.min.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/default.styles.min.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/custom.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script>
        window.blazorCulture = {
            get: () => window.localStorage['BlazorCulture'],
            getPreferred: () => {
                const stored = window.localStorage['BlazorCulture'];
                if (stored) {
                    return stored;
                }
                const langs = (navigator.languages && navigator.languages.length)
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage];
                for (const lang of langs) {
                    const primary = String(lang || '').split('-')[0].toLowerCase();
                    if (primary === 'de' || primary === 'en') {
                        return primary;
                    }
                }
                return 'en';
            },
            set: (value) => { window.localStorage['BlazorCulture'] = value; },
            setDocumentLang: (value) => { document.documentElement.lang = value || 'en'; }
        };
        window.blazorCulture.setDocumentLang(window.blazorCulture.getPreferred());
    </script>
</head>

<body>
    <div id="app">
        <div class="app-boot" aria-hidden="true">
            <img class="app-boot-icon" src="icon-512.png" width="512" height="512" alt="Siteswap Generator" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
    <script src="sw-registrator.js"></script>
    <script src="brotliloader.min.js" type="module"></script>
</body>

</html>
